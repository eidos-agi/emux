<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #1e1e1e; --chrome: #141414; --line: #2b2b2b; --fg: #d4d4d4; --dim: #8a8a8a;
          --blue: #4a9eff; --green: #4caf50; --red: #f44336; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; flex-direction: column;
         font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); }

  .bar { height: 24px; flex: none; display: flex; align-items: center; gap: 6px;
         padding: 0 8px; background: var(--chrome); color: var(--dim);
         white-space: nowrap; overflow: hidden; }
  .bar span { overflow: hidden; text-overflow: ellipsis; }
  #title { color: var(--fg); }
  #fav { width: 13px; height: 13px; flex: none; border-radius: 2px; }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--dim); }
  .dot.live { background: var(--green); }
  .dot.dead { background: var(--red); }
  .dot.unseen { background: var(--blue); box-shadow: 0 0 5px var(--blue); }
  .dot.running { background: var(--green); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* Native <select> can't color individual options, and its emoji fallback looked awful. */
  #picker { flex: none; position: relative; border-bottom: 1px solid var(--line); background: var(--chrome); }
  #trigger { display: flex; align-items: center; gap: 7px; width: 100%; box-sizing: border-box;
             padding: 5px 8px; background: none; border: 0; color: var(--fg);
             font: inherit; text-align: left; cursor: pointer; }
  #trigger:hover { background: #1c1c1c; }
  #trigger .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #trigger .chev { color: var(--dim); transition: transform .12s; }
  #picker.open #trigger .chev { transform: rotate(180deg); }
  #count { color: var(--dim); }

  #list { display: none; position: absolute; z-index: 10; left: 0; right: 0; top: 100%;
          max-height: 320px; overflow-y: auto; background: #191919;
          border: 1px solid var(--line); border-top: 0;
          box-shadow: 0 8px 20px rgba(0,0,0,.55); }
  #picker.open #list { display: block; }
  #list .row { display: flex; align-items: center; gap: 7px; padding: 5px 8px; cursor: pointer; }
  #list .row:hover { background: #232323; }
  #list .row.current { background: #202b38; }
  #list .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .row .tag { color: var(--dim); font-size: 10px; }
  #list .row.gone .name { color: var(--dim); text-decoration: line-through; }
  #list .empty { padding: 8px; color: var(--dim); }

  /* Split controls. Direction is a toggle rather than two buttons per role, so adding a
     manager and adding a worker stay one click each. */
  #panes { flex: none; display: flex; align-items: center; gap: 4px; padding: 4px 8px;
           background: var(--chrome); border-bottom: 1px solid var(--line); }
  #panes button, #panes select { background: #232323; border: 1px solid var(--line);
           color: var(--fg); font: inherit; padding: 2px 7px; border-radius: 3px; cursor: pointer; }
  #panes button:hover:not(:disabled) { background: #2d2d2d; border-color: #3d3d3d; }
  #panes button:disabled { opacity: .4; cursor: default; }
  #panes .grow { margin-left: auto; color: var(--dim); }
  #dir.on { color: var(--blue); border-color: var(--blue); }

  #rail { flex: none; display: flex; gap: 4px; padding: 4px 8px; background: var(--chrome);
          border-bottom: 1px solid var(--line); overflow-x: auto; }
  #rail[hidden] { display: none; }
  .chip { display: flex; align-items: center; gap: 4px; padding: 2px 8px; cursor: grab;
          background: #232323; border: 1px solid var(--line); border-radius: 3px;
          white-space: nowrap; user-select: none; }
  .chip.active { border-color: var(--green); }
  .chip.sel { background: #202b38; border-color: var(--blue); }
  .chip.orphan { border-color: var(--red); }
  .chip.over { border-color: var(--blue); background: #26313d; }
  .chip:active { cursor: grabbing; }
  #mouse.on { color: var(--blue); border-color: var(--blue); }

  iframe { border: 0; width: 100%; flex: 1; }
</style>
</head>
<body>
<div class="bar">
  <span id="dot" class="dot live"></span><img id="fav" hidden><span id="title"></span><span id="url"></span>
</div>

<div id="picker">
  <button id="trigger" type="button">
    <span id="trigger-dot" class="dot live"></span>
    <span class="label" id="trigger-label">sessions</span>
    <span id="count"></span>
    <span class="chev">▾</span>
  </button>
  <div id="list"></div>
</div>

<div id="panes">
  <select id="agent" title="which agent the new pane runs">
    <option value="grok">grok</option>
    <option value="claude" selected>claude</option>
    <option value="codex">codex</option>
    <option value="gemini">gemini</option>
  </select>
  <button id="mouse" type="button" title="Mouse mode: drag borders to resize, click to focus. Off lets you drag-select text.">🖱</button>
  <button id="add-manager" type="button" title="One per team: opens above and takes over every pane">+ mgr</button>
  <button id="add-worker" type="button" title="Opens below the target and reports to the manager">+ worker</button>
  <button id="dir" type="button" title="Stacked or side by side">⬍</button>
  <button id="tidy" type="button" title="Even out the pane sizes">tidy</button>
  <button id="fork" type="button" title="Break the target pane out into its own window">fork</button>
  <button id="close-pane" type="button" title="Close the target pane">✕</button>
  <span class="grow" id="panes-count"></span>
</div>

<!-- The rail is the drag surface. tmux has no drag-a-pane-to-a-new-spot primitive, and the
     terminal is a cross-origin iframe we can't reach into, so rearranging happens on chips
     out here: drag one onto another to swap them, click one to focus it. -->
<div id="rail"></div>

<iframe id="term"></iframe>

<div class="bar">
  <span id="ids"></span><span id="scope"></span>
  <span style="margin-left:auto" id="build">fleetkick</span>
</div>
<script src="panel.js"></script>
</body>
</html>
