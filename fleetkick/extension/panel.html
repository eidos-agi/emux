<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #1e1e1e; --chrome: #141414; --line: #2b2b2b; --fg: #d4d4d4; --dim: #8a8a8a;
          --blue: #4a9eff; --green: #4caf50; --red: #f44336; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; flex-direction: column; overflow: hidden;
         font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); }

  .bar { height: 24px; flex: none; display: flex; align-items: center; gap: 6px;
         padding: 0 8px; background: var(--chrome); color: var(--dim);
         white-space: nowrap; overflow: hidden; }
  .bar span { overflow: hidden; text-overflow: ellipsis; }
  #title { color: var(--fg); }
  #fav { width: 13px; height: 13px; flex: none; border-radius: 2px; }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--dim); }
  .dot.live { background: var(--green); }
  .dot.dead { background: var(--red); }
  .dot.unseen { background: var(--blue); box-shadow: 0 0 5px var(--blue); }
  .dot.running { background: var(--green); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  #picker { flex: none; position: relative; border-bottom: 1px solid var(--line); background: var(--chrome); }
  #trigger { display: flex; align-items: center; gap: 7px; width: 100%; box-sizing: border-box;
             padding: 5px 8px; background: none; border: 0; color: var(--fg);
             font: inherit; text-align: left; cursor: pointer; }
  #trigger:hover { background: #1c1c1c; }
  #trigger .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #trigger .chev { color: var(--dim); transition: transform .12s; }
  #picker.open #trigger .chev { transform: rotate(180deg); }
  #count { color: var(--dim); }

  #list { display: none; position: absolute; z-index: 30; left: 0; right: 0; top: 100%;
          max-height: 320px; overflow-y: auto; background: #191919;
          border: 1px solid var(--line); border-top: 0;
          box-shadow: 0 8px 20px rgba(0,0,0,.55); }
  #picker.open #list { display: block; }
  #list .row { display: flex; align-items: center; gap: 7px; padding: 5px 8px; cursor: pointer; }
  #list .row:hover { background: #232323; }
  #list .row.current { background: #202b38; }
  #list .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .row .tag { color: var(--dim); font-size: 10px; }
  #list .row.gone .name { color: var(--dim); text-decoration: line-through; }
  #list .empty { padding: 8px; color: var(--dim); }

  #tools { flex: none; display: flex; align-items: center; gap: 4px; padding: 4px 8px;
           background: var(--chrome); border-bottom: 1px solid var(--line); }
  #tools button, #tools select { background: #232323; border: 1px solid var(--line);
           color: var(--fg); font: inherit; padding: 2px 7px; border-radius: 3px; cursor: pointer; }
  #tools button:hover:not(:disabled) { background: #2d2d2d; border-color: #3d3d3d; }
  #tools button:disabled { opacity: .4; cursor: default; }
  #tools .grow { margin-left: auto; color: var(--dim); }

  /* The stack: one slot per agent, each its own terminal, with dividers the panel draws
     itself. This is the whole point of the layout living here — a divider in panel DOM can
     be dragged and clicked, a tmux pane border inside a cross-origin iframe cannot. */
  #stack { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .slot { display: flex; flex-direction: column; min-height: 60px; flex: 1 1 0; }
  .slot > header { flex: none; display: flex; align-items: center; gap: 6px; padding: 2px 8px;
                   background: #171717; border-bottom: 1px solid var(--line); color: var(--dim); }
  /* --tint is derived from the page's own colours; manager closest, workers stepped. */
  .slot > header { border-left: 3px solid var(--tint, #5a5a5a); }
  .slot.mgr > header { border-left-width: 5px; }
  .slot > header .swatch { width: 7px; height: 7px; border-radius: 2px;
                           background: var(--tint, #5a5a5a); flex: none; }
  .slot > header .who { color: var(--fg); font-weight: 600; }
  .slot > header .grow { margin-left: auto; }
  .slot > header .mail { color: var(--blue); }
  .slot > header button { background: none; border: 0; color: var(--dim); cursor: pointer;
                          font: inherit; padding: 0 3px; }
  .slot > header button:hover { color: var(--fg); }
  .slot iframe { border: 0; width: 100%; flex: 1; min-height: 0; }

  .divider { flex: none; height: 7px; cursor: row-resize; background: #2b2b2b;
             border-top: 1px solid #101010; border-bottom: 1px solid #101010;
             display: flex; align-items: center; justify-content: center; }
  .divider::after { content: ''; width: 44px; height: 3px; border-radius: 2px; background: #5a5a5a; }
  .divider:hover { background: #35424f; }
  .divider:hover::after { background: var(--blue); }
  /* While dragging, iframes must stop swallowing mousemove or the drag dies the moment the
     cursor crosses a terminal. */
  body.dragging iframe { pointer-events: none; }
  body.dragging { cursor: row-resize; user-select: none; }
</style>
</head>
<body>
<div class="bar">
  <span id="dot" class="dot live"></span><img id="fav" hidden><span id="title"></span><span id="url"></span>
</div>

<div id="picker">
  <button id="trigger" type="button">
    <span id="trigger-dot" class="dot live"></span>
    <span class="label" id="trigger-label">sessions</span>
    <span id="count"></span>
    <span class="chev">▾</span>
  </button>
  <div id="list"></div>
</div>

<div id="tools">
  <select id="agent" title="which agent a new teammate runs">
    <option value="claude" selected>claude</option>
    <option value="grok">grok</option>
    <option value="codex">codex</option>
    <option value="gemini">gemini</option>
  </select>
  <button id="add-manager" type="button" title="One per group: takes charge of this tab">+ manager</button>
  <button id="add-worker" type="button" title="Another agent on this tab, reporting to the manager">+ worker</button>
  <button id="even" type="button" title="Even out the terminal heights">even</button>
  <span class="grow" id="roster"></span>
</div>

<div id="stack"></div>

<div class="bar">
  <span id="ids"></span><span id="scope"></span>
  <span style="margin-left:auto" id="build">fleetkick</span>
</div>
<script src="panel.js"></script>
</body>
</html>
