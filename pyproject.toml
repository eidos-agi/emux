[project]
name = "emux"
version = "0.59.0"
description = "Eidos mux — pick up where you left off in tmux, and let an agent drive it. TUI picker for registered sessions, an MCP server for agent-driven send/capture plus a ladder of autonomy (ask/navigate/goal) that observes, converses with, and pursues goals through existing sessions, and a web daemon that monitors any session like a chatbot. The autonomous loop never spawns or kills; explicit tmux_spawn does."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eidos AGI", email = "daniel@eidosagi.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "tmux", "agent", "automation", "terminal", "session", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
]
dependencies = [
    "mcp>=1.2.0",
    "textual>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyright>=1.1.400",
]

[project.urls]
Homepage = "https://github.com/eidos-agi/emux"
Repository = "https://github.com/eidos-agi/emux"
Issues = "https://github.com/eidos-agi/emux/issues"

[project.scripts]
emux = "emux.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
# Standard, not strict: catches the real bug class (None-access, shape/return
# mismatches) so an AI editing emux gets useful author-time feedback, without
# the strict-only `reportUnknown*` tax that a subprocess/JSON codebase can only
# satisfy by annotating everything `Any`. Plus cheap dead-code catches.
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
