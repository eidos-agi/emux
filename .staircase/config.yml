report_slots: [morning, evening]
stakeholders: []
proof_adapters: [manual]
gate_command: 
texture_notes: true
retired_vocabulary: []
operator_tz: America/Chicago
stakeholder_tz: 
deadline_local: 18:00
morning_local: 07:00
burden_of_proof: artifact
require_visual_attestation: false
require_cases: false
min_cases: 3
require_dimensions: [happy, negative]
