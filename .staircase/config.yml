# .staircase/config.yml — the delivery SLA for this project.
# Cadence changes: use `staircase set-quota` (never edit cadence_per_day by hand).
# Time: slot wall-clocks (deadline_local/morning_local) are read in stakeholder_tz; operator_tz is where the agent runs.
schema: 1
mission: Let one intelligence manage many terminals without drowning.
