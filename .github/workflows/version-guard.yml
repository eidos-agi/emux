name: Version guard

# Prevents the failure mode from EID-790: feature PRs merging into main while
# the version stays pinned to an already-claimed release number, so a later tag
# ships un-versioned code. When a PR to main touches src/, this requires the
# version to be bumped (pyproject.toml and src/emux/__init__.py in lockstep) and
# a matching `## v<version>` CHANGELOG entry to exist. Deliberate non-release
# source changes can opt out with `[skip-version-check]` in the PR title.

on:
  pull_request:
    branches: [main]

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require version bump + CHANGELOG entry when src/ changes
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
          BASE="origin/$BASE_REF"

          # Escape hatch for deliberate non-release source changes.
          if printf '%s' "$PR_TITLE" | grep -qF '[skip-version-check]'; then
            echo "PR title contains [skip-version-check] — guard skipped."
            exit 0
          fi

          # Only enforce when files under src/ actually changed vs the base.
          if git diff --name-only "$BASE"...HEAD | grep -q '^src/'; then
            echo "src/ changed on this PR — enforcing version bump + CHANGELOG."
          else
            echo "No src/ changes — nothing to enforce."
            exit 0
          fi

          pyver() { python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"; }
          NEW="$(pyver)"
          BASE_VER="$(git show "$BASE:pyproject.toml" | python -c "import sys,tomllib;print(tomllib.load(sys.stdin.buffer)['project']['version'])")"
          INIT="$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('src/emux/__init__.py').read()).group(1))")"
          ESC="$(printf '%s' "$NEW" | sed 's/[.]/\\./g')"

          fail=0
          if [ "$NEW" = "$BASE_VER" ]; then
            echo "::error::src/ changed but version is still $NEW (unchanged from $BASE_REF). Bump pyproject.toml + src/emux/__init__.py, or add [skip-version-check] to the PR title for a deliberate non-release change."
            fail=1
          fi
          if [ "$NEW" != "$INIT" ]; then
            echo "::error::Version mismatch: pyproject.toml=$NEW but src/emux/__init__.py=$INIT — keep them in lockstep."
            fail=1
          fi
          if ! grep -qE "^## v${ESC}( |-|\$)" CHANGELOG.md; then
            echo "::error::No CHANGELOG entry '## v${NEW}' — add one before merging."
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then
            echo "Version guard passed: $NEW (bumped from $BASE_VER), pyproject == __init__, CHANGELOG entry present."
          fi
          exit "$fail"
